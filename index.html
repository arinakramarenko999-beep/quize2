<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровой иммунитет: ты катализатор или защитник?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FA;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6B86;--line:#CBD6E8;
  --accent:#2B59FF;--accent-ink:#FFFFFF;--good:#0E8F6A;--warn:#C2410C;--mid:#8A6A00;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1730;--surface:#182243;--ink:#EAF0FF;--muted:#9FB0D3;--line:#2A3866;
  --accent:#6E8DFF;--accent-ink:#0F1730;--good:#4FD1A5;--warn:#FF9B6B;--mid:#E6C458;}}
:root[data-theme="dark"]{
  --bg:#0F1730;--surface:#182243;--ink:#EAF0FF;--muted:#9FB0D3;--line:#2A3866;
  --accent:#6E8DFF;--accent-ink:#0F1730;--good:#4FD1A5;--warn:#FF9B6B;--mid:#E6C458;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 20px 48px}
h1,h2{font-family:Unbounded,"Arial Black",system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(26px,7vw,38px)}
h2{font-size:clamp(20px,5vw,26px);line-height:1.3;font-weight:500}
p{margin:0}
.lead{color:var(--muted);margin:16px 0 28px}
.btn{font:600 17px Onest,system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 22px;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;gap:6px;margin-bottom:8px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--accent)}
.meta{color:var(--muted);font-size:15px;margin-bottom:24px}
.scene{color:var(--accent);font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:12px;margin:24px 0}
.opt{text-align:left;font:400 17px/1.45 Onest,system-ui,sans-serif;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--accent);border-width:3px;padding:15px}
.opt.dim{opacity:.55}
.fb{background:var(--surface);border-left:6px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.fb b{display:block;margin-bottom:2px}
.fb.s0{border-color:var(--warn)}.fb.s1{border-color:var(--mid)}.fb.s3{border-color:var(--good)}
.hidden{display:none}
.emoji{font-size:64px;line-height:1;margin-bottom:12px}
.score{color:var(--muted);margin:12px 0 20px}
.verdict{background:var(--surface);border-radius:16px;padding:24px;border:2px solid var(--line)}
.scale{display:grid;gap:8px;margin:28px 0 24px;padding:0;list-style:none;font-size:15px;color:var(--muted)}
.scale li{padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.scale li.me{border:2px solid var(--accent);color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
<section id="start">
  <h1>Цифровой иммунитет: ты катализатор или защитник?</h1>
  <p class="lead">Три ситуации из онлайн-жизни. Выбери, что сделаешь на самом деле, и узнай, какую роль ты играешь, когда начинается травля.</p>
  <button class="btn" id="go">Начать тест</button>
</section>

<section id="quiz" class="hidden">
  <div class="bar" id="bar" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="meta" id="meta"></p>
  <p class="scene" id="scene"></p>
  <h2 id="q"></h2>
  <div class="opts" id="opts"></div>
  <div class="fb hidden" id="fb" role="status"></div>
  <button class="btn hidden" id="next"></button>
</section>

<section id="result" class="hidden">
  <div class="verdict">
    <div class="emoji" id="rEmoji"></div>
    <h1 id="rTitle"></h1>
    <p class="score" id="rScore"></p>
    <p id="rText"></p>
  </div>
  <ul class="scale" id="scale"></ul>
  <button class="btn" id="again">Пройти заново</button>
</section>
</main>

<script>
var QUESTIONS=[
{scene:"Ситуация с локальным мемом",q:"В закрытом чате вашего курса выложили оскорбительный мем про одногруппника, который сильно ошибся на презентации. Ваши действия?",
 a:[{t:"Перешлю в ЛС лучшему другу, чтобы чисто поржать.",p:0,f:"Вы увеличиваете масштаб лавины."},
    {t:"Ничего не сделаю, просто пролистну ленту дальше.",p:1,f:"Вы заняли позицию молчаливого свидетеля."},
    {t:"Напишу в чат «Ребят, это уже жестко, удалите» и кину жалобу админу.",p:3,f:"Вы осознанно ставите цифровой барьер."}]},
{scene:"Публичная травля под постом",q:"Под постом вашей знакомой в соцсети начался массовый наплыв хейтеров из-за её непопулярного мнения. Как поступите?",
 a:[{t:"Буду читать комментарии, лайкать самые смешные и запасаться попкорном.",p:0,f:"Вы поднимаете алгоритмические охваты буллинга."},
    {t:"Постараюсь не вмешиваться, это её личные разборки.",p:1,f:"Пассивное участие в давлении."},
    {t:"Напишу ей в личку простые слова: «Я с тобой, не слушай их».",p:3,f:"Вы даёте мощную психологическую опору."}]},
{scene:"Случайный скриншот чужой тайны",q:"Вам прислали скриншот переписки, где раскрывается личная и довольно постыдная тайна вашего сокурсника. Что сделаете?",
 a:[{t:"Перешлю в общий чат группы с подписью «Смотрите, жесть какая!»",p:0,f:"Вы стали прямым соучастником травли."},
    {t:"Проигнорирую и удалю сообщение.",p:1,f:"Вы не дали лавине расти, но оставили ситуацию скрытой."},
    {t:"Удалю, скажу отправителю, что это грязный поступок, и предупрежу сокурсника.",p:3,f:"Вы полностью разрушили цепочку распространения."}]}
];
var RESULTS=[
{min:0,max:2,range:"0–2 балла",emoji:"🤡",title:"Цифровой катализатор",text:"Вы не хотите зла, но ваши лайки и репосты работают как топливо для лавины буллинга. Помните: уже на 2-м часу автор теряет контроль над постом, и дальше его продвигаете именно вы."},
{min:3,max:5,range:"3–5 баллов",emoji:"👁️",title:"Молчаливый свидетель",text:"Вы не совершаете плохих поступков, но ваше молчание создаёт у агрессоров иллюзию полного согласия группы. Буллинг растёт там, где окружающие просто листают ленту дальше."},
{min:6,max:9,range:"6–9 баллов",emoji:"🛡️",title:"Цифровой защитник",text:"Вы отлично понимаете цену одного клика. Вы умеете вовремя сказать «Стоп» и оборвать цепочку травли. Именно на таких людях держится безопасность в сети!"}
];
var i=0,score=0,locked=false;
function $(id){return document.getElementById(id)}
function show(id){["start","quiz","result"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});window.scrollTo(0,0)}
function render(){
  var d=QUESTIONS[i];locked=false;
  $("meta").textContent="Вопрос "+(i+1)+" из "+QUESTIONS.length;
  $("scene").textContent=d.scene;$("q").textContent=d.q;
  Array.prototype.forEach.call($("bar").children,function(b,k){b.classList.toggle("on",k<=i)});
  var box=$("opts");box.innerHTML="";
  d.a.forEach(function(o,k){
    var b=document.createElement("button");b.className="opt";b.textContent=o.t;
    b.onclick=function(){pick(k)};box.appendChild(b);
  });
  $("fb").classList.add("hidden");$("next").classList.add("hidden");
}
function pick(k){
  if(locked)return;locked=true;
  var o=QUESTIONS[i].a[k];score+=o.p;
  Array.prototype.forEach.call($("opts").children,function(b,n){
    b.disabled=true;b.classList.add(n===k?"picked":"dim");
  });
  var fb=$("fb");fb.className="fb s"+o.p;
  fb.innerHTML="";var b=document.createElement("b");
  b.textContent=o.p+" "+(o.p===1?"балл":o.p===0?"баллов":"балла");
  var t=document.createElement("span");t.textContent=o.f;
  fb.appendChild(b);fb.appendChild(t);
  var n=$("next");n.textContent=i<QUESTIONS.length-1?"Дальше":"Узнать результат";
  n.classList.remove("hidden");n.focus();
}
function finish(){
  var r=RESULTS.filter(function(x){return score>=x.min&&score<=x.max})[0];
  $("rEmoji").textContent=r.emoji;$("rTitle").textContent=r.title;
  $("rScore").textContent="Ваш результат: "+score+" из 9";$("rText").textContent=r.text;
  var ul=$("scale");ul.innerHTML="";
  RESULTS.forEach(function(x){
    var li=document.createElement("li");li.textContent=x.range+": "+x.title+" "+x.emoji;
    if(x===r)li.className="me";ul.appendChild(li);
  });
  show("result");
}
$("go").onclick=function(){i=0;score=0;show("quiz");render()};
$("next").onclick=function(){if(i<QUESTIONS.length-1){i++;render();window.scrollTo(0,0)}else finish()};
$("again").onclick=function(){i=0;score=0;show("quiz");render()};
</script>
</body>
</html>
